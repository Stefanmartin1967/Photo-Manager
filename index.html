<!DOCTYPE html>
<html lang="fr" data-theme="maritime">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Djerba Photo Manager</title>
  </head>
  <body>
    <div id="app">

      <!-- TOP BAR -->
      <div class="hw-topbar">
        <div class="hw-topbar-left">
          <span class="hw-app-title">Djerba Pro</span>
          <div class="hw-separator"></div>
          <select id="themeSelector" class="hw-theme-select" title="Changer de thème">
            <option value="maritime">Maritime</option>
            <option value="desert">Désert</option>
            <option value="oasis">Oasis</option>
            <option value="night">Nuit</option>
          </select>
        </div>

        <div class="hw-topbar-center">
          <div class="hw-radius-control">
            <button id="radiusMinus" class="hw-radius-btn" title="- 50m"><i data-lucide="minus"></i></button>
            <input type="number" id="radiusInput" class="hw-radius-input" value="250" step="50" min="0" title="Rayon de groupement (m)">
            <span class="hw-radius-unit">m</span>
            <button id="radiusPlus" class="hw-radius-btn" title="+ 50m"><i data-lucide="plus"></i></button>
          </div>
          <div class="hw-separator"></div>
          <input type="file" id="photoInput" multiple accept="image/*" style="display: none;">
          <button id="addPhotoBtn" class="hw-btn" title="Ajouter des photos">
            <i data-lucide="image-plus"></i>
          </button>
          <button id="compareBtn" class="hw-btn" title="Agrandir / Comparer (1 à 4)">
            <i data-lucide="arrow-right-left"></i>
          </button>
          <span id="heic-progress" class="hw-heic-progress" style="display:none;"></span>
        </div>

        <div class="hw-topbar-right">
          <button id="saveBtn" class="hw-btn" title="Enregistrer Tout">
            <i data-lucide="save"></i>
          </button>
          <button id="shareBtn" class="hw-btn" title="Partager la sélection">
            <i data-lucide="share-2"></i>
          </button>
          <button id="clearBtn" class="hw-btn hw-btn-danger" title="Vider le projet en cours">
            <i data-lucide="trash-2"></i>
          </button>
        </div>
      </div>

      <!-- MAIN CONTENT -->
      <div class="hw-main">
        <div class="hw-workspace">
          <div class="hw-gallery-container">
            <div id="default-gallery" class="hw-gallery"></div>
          </div>
        </div>
      </div>

      <!-- COMPARE MODAL -->
      <div id="compare-modal" class="hw-modal-overlay" style="display: none;">
        <span class="hw-modal-title-bar">Comparaison</span>
        <button class="hw-modal-close close-compare">&times;</button>
        <div id="compare-grid" class="hw-compare-grid"></div>
      </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
