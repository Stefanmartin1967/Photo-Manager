name: Sync GeoJSON from History-Walk-V1

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-geojson:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download djerba.geojson
        run: |
          curl -sS -o public/djerba.geojson https://raw.githubusercontent.com/Stefanmartin1967/History-Walk-V1/main/public/djerba.geojson

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/djerba.geojson
          if git diff --staged --quiet; then
            echo "No changes in djerba.geojson"
          else
            git commit -m "chore: synchronisation de djerba.geojson depuis History-Walk-V1"
            git push
          fi
